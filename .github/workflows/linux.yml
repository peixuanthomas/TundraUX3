name: Linux

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu 24.04 (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Locked build
        run: cargo build --workspace --locked
      - name: Test user sessions and authorization boundaries
        run: |
          cargo test --locked -p session-protocol -p tundra-sessiond -p tundra-greeter -p tundra-privileged -p system-maintenance
          cargo test --locked -p platform --test linux_user_dirs --test workspace_watchdog_constraints
          python3 -m unittest discover -s scripts/tests -p test_stage_linux_system.py
          bash -n packaging/linux/build-kmscon.sh scripts/package-linux.sh
      - name: Test Linux Trash ownership and root lifecycle
        run: |
          cargo test --locked -p platform --lib
          cargo test --locked -p platform --lib --no-run --message-format=json > "$RUNNER_TEMP/platform-tests.json"
          test_binary="$(jq -r 'select(.executable != null and .target.name == "platform") | .executable' "$RUNNER_TEMP/platform-tests.json")"
          sudo "$test_binary" --ignored --exact linux::root_trash_tests::root_trash_handles_other_users_and_preserves_private_metadata
      - name: Test localization and resource recovery
        run: |
          python3 scripts/check-localization.py
          cargo test --locked -p i18n -p ascii-assets
          cargo test --locked -p ui --test localization
          cargo test --locked -p shell session::localization::tests --lib
      - name: Test system metrics
        run: |
          cargo test --locked -p platform --test linux_logs
          cargo test --locked -p runtime-log
          cargo test --locked -p app runtime_logs
          cargo test --locked -p cli --test logs
          cargo test --locked -p ui --test logs
          cargo test --locked -p platform --test system_status
          cargo test --locked -p system-services --no-default-features
          cargo test --locked -p system-services --features runtime

  fedora:
    name: Fedora 43 (x86_64)
    runs-on: ubuntu-24.04
    container: fedora:43
    steps:
      - name: Install checkout and build requirements
        run: |
          dnf install -y cmake curl gcc gcc-c++ git make openssl-devel perl pkgconf-pkg-config
      - uses: actions/checkout@v6
      - name: Install stable Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Locked build
        run: |
          source "$HOME/.cargo/env"
          cargo build --workspace --locked
      - name: Test user sessions and authorization boundaries
        run: |
          source "$HOME/.cargo/env"
          cargo test --locked -p session-protocol -p tundra-sessiond -p tundra-greeter -p tundra-privileged -p system-maintenance
          cargo test --locked -p platform --test linux_user_dirs --test workspace_watchdog_constraints
          python3 -m unittest discover -s scripts/tests -p test_stage_linux_system.py
          bash -n packaging/linux/build-kmscon.sh scripts/package-linux.sh
      - name: Test Linux Trash ownership and root lifecycle
        run: |
          source "$HOME/.cargo/env"
          cargo test --locked -p platform --lib
          cargo test --locked -p platform --lib root_trash_handles_other_users_and_preserves_private_metadata -- --ignored
      - name: Test system metrics
        run: |
          source "$HOME/.cargo/env"
          cargo test --locked -p platform --test linux_logs
          cargo test --locked -p runtime-log
          cargo test --locked -p app runtime_logs
          cargo test --locked -p cli --test logs
          cargo test --locked -p ui --test logs
          cargo test --locked -p platform --test system_status
          cargo test --locked -p system-services --no-default-features
          cargo test --locked -p system-services --features runtime
