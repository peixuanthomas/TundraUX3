name: Linux

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu 24.04 (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Locked build
        run: cargo build --workspace --locked
      - name: Test system metrics
        run: |
          cargo test --locked -p platform --test system_status
          cargo test --locked -p system-services

  fedora:
    name: Fedora 42 (x86_64)
    runs-on: ubuntu-24.04
    container: fedora:42
    steps:
      - name: Install checkout and build requirements
        run: |
          dnf install -y cmake curl gcc gcc-c++ git make openssl-devel perl pkgconf-pkg-config
      - uses: actions/checkout@v6
      - name: Install stable Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Locked build
        run: |
          source "$HOME/.cargo/env"
          cargo build --workspace --locked
      - name: Test system metrics
        run: |
          source "$HOME/.cargo/env"
          cargo test --locked -p platform --test system_status
          cargo test --locked -p system-services
