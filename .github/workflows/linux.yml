name: Linux

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu 24.04 (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Locked build
        run: cargo build --workspace --locked
      - name: Test ordinary-user identity and platform boundaries
        run: |
          cargo test --locked -p platform --lib
          cargo test --locked -p platform --lib account_service_reads_and_writes -- --ignored
          cargo test --locked -p identity
          cargo test --locked -p shell --test settings linux_personal_settings_work_without_system_account_service
      - name: Test localization and resource recovery
        run: |
          python3 scripts/check-localization.py
          cargo test --locked -p i18n -p ascii-assets
          cargo test --locked -p ui --test localization
          cargo test --locked -p shell session::localization::tests --lib
      - name: Test system metrics
        run: |
          cargo test --locked -p platform --test linux_logs
          cargo test --locked -p runtime-log
          cargo test --locked -p app runtime_logs
          cargo test --locked -p cli --test logs
          cargo test --locked -p ui --test logs
          cargo test --locked -p platform --test system_status
          cargo test --locked -p system-services --no-default-features
          cargo test --locked -p system-services --features runtime

  fedora:
    name: Fedora 43 (x86_64)
    runs-on: ubuntu-24.04
    container: fedora:43
    steps:
      - name: Install checkout and build requirements
        run: |
          dnf install -y cmake curl dbus-daemon gcc gcc-c++ git make openssl-devel perl pkgconf-pkg-config shadow-utils util-linux
      - uses: actions/checkout@v6
      - name: Install stable Rust
        run: |
          useradd --create-home tundra-ci
          chown -R tundra-ci:tundra-ci "$GITHUB_WORKSPACE"
          runuser -u tundra-ci -- bash -c 'curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal'
          echo "/home/tundra-ci/.cargo/bin" >> "$GITHUB_PATH"
      - name: Locked build
        run: |
          runuser -u tundra-ci -- /home/tundra-ci/.cargo/bin/cargo build --workspace --locked
      - name: Test ordinary-user identity and platform boundaries
        run: |
          runuser -u tundra-ci -- /home/tundra-ci/.cargo/bin/cargo test --locked -p platform --lib
          runuser -u tundra-ci -- /home/tundra-ci/.cargo/bin/cargo test --locked -p platform --lib account_service_reads_and_writes -- --ignored
          runuser -u tundra-ci -- /home/tundra-ci/.cargo/bin/cargo test --locked -p identity
          runuser -u tundra-ci -- /home/tundra-ci/.cargo/bin/cargo test --locked -p shell --test settings linux_personal_settings_work_without_system_account_service
      - name: Test system metrics
        run: |
          runuser -u tundra-ci -- /home/tundra-ci/.cargo/bin/cargo test --locked -p platform --test linux_logs
          runuser -u tundra-ci -- /home/tundra-ci/.cargo/bin/cargo test --locked -p runtime-log
          runuser -u tundra-ci -- /home/tundra-ci/.cargo/bin/cargo test --locked -p app runtime_logs
          runuser -u tundra-ci -- /home/tundra-ci/.cargo/bin/cargo test --locked -p cli --test logs
          runuser -u tundra-ci -- /home/tundra-ci/.cargo/bin/cargo test --locked -p ui --test logs
          runuser -u tundra-ci -- /home/tundra-ci/.cargo/bin/cargo test --locked -p platform --test system_status
          runuser -u tundra-ci -- /home/tundra-ci/.cargo/bin/cargo test --locked -p system-services --no-default-features
          runuser -u tundra-ci -- /home/tundra-ci/.cargo/bin/cargo test --locked -p system-services --features runtime
