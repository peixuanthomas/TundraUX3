name: Experimental bundled runtime

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/bundled-wezterm-experimental.yml'
      - 'patches/wezterm-managed-v1.patch'
      - 'third_party/wezterm'
      - 'scripts/build-bundled-wezterm.sh'
      - 'scripts/package-bundled-*'
      - 'scripts/verify-wezterm-submodule.sh'
      - 'packaging/**'
      - 'crates/launcher/**'
      - 'crates/recovery/**'
      - 'crates/shell/**'
      - 'crates/watchdog/**'
      - 'crates/platform/**'
      - 'Cargo.lock'
      - 'Cargo.toml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-x64:
    name: Linux bundled runtime (experimental)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Test launcher, recovery capsule, Shell protocol and containment
        run: cargo test --locked -p launcher -p recovery -p watchdog -p platform -p shell
      - name: Install WezTerm build dependencies
        shell: bash
        run: env CI=yes PATH=$PATH ./third_party/wezterm/get-deps
      - name: Verify pin and build patched private WezTerm
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-wezterm-submodule.sh
          bash scripts/build-bundled-wezterm.sh
          bash scripts/verify-wezterm-submodule.sh
      - name: Assemble private runtime
        shell: bash
        env:
          TUNDRA_WEZTERM_RUNTIME_DIR: ${{ github.workspace }}/target/wezterm-bundled
        run: bash scripts/package-bundled-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-bundled-linux-x64
          path: |
            dist/tundraux3-bundled-*.tar.gz
            dist/tundraux3-bundled_*.deb
            dist/tundraux3-bundled-*.SHA256SUMS
          if-no-files-found: error

  windows-x64:
    name: Windows bundled runtime (experimental)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install stable Rust
        shell: pwsh
        run: rustup toolchain install stable --profile minimal; rustup default stable
      - name: Test launcher, recovery capsule, Shell protocol and containment
        shell: pwsh
        run: cargo test --locked -p launcher -p recovery -p watchdog -p platform -p shell
      - name: Verify pin and build patched private WezTerm
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-wezterm-submodule.sh
          bash scripts/build-bundled-wezterm.sh
          bash scripts/verify-wezterm-submodule.sh
      - name: Assemble private runtime
        shell: pwsh
        env:
          TUNDRA_WEZTERM_RUNTIME_DIR: ${{ github.workspace }}\target\wezterm-bundled
        run: ./scripts/package-bundled-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-bundled-windows-x64
          path: |
            dist/TundraUX3-*-experimental-windows-x64.zip
            dist/TundraUX3-*-experimental-windows-x64.zip.sha256
          if-no-files-found: error

  macos-native:
    name: macOS bundled runtime (experimental)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Test launcher, recovery capsule, Shell protocol and containment
        run: cargo test --locked -p launcher -p recovery -p watchdog -p platform -p shell
      - name: Install WezTerm build dependencies
        shell: bash
        run: env CI=yes PATH=$PATH ./third_party/wezterm/get-deps
      - name: Verify pin and build patched private WezTerm
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-wezterm-submodule.sh
          bash scripts/build-bundled-wezterm.sh
          bash scripts/verify-wezterm-submodule.sh
      - name: Assemble unsigned app bundle
        shell: bash
        env:
          TUNDRA_WEZTERM_RUNTIME_DIR: ${{ github.workspace }}/target/wezterm-bundled
        run: bash scripts/package-bundled-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-bundled-macos-native
          path: |
            dist/TundraUX3-*-experimental-macos-*.zip
            dist/TundraUX3-*-experimental-macos-*.sha256
          if-no-files-found: error
