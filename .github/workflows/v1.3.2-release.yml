name: Publish V1.3.2 release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-v1.3.2
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_REF: ${{ github.sha }}
  RELEASE_TAG: v1.3.2

jobs:
  validate:
    name: Validate release source and version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - name: Verify release tag matches the build commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')" = "$RELEASE_REF"
      - name: Require master and consistent package versions
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/master
          cargo metadata --locked --no-deps --format-version 1 > metadata.json
          jq -e '[.packages[] | select(.manifest_path | contains("/crates/"))] | length == 14 and all(.[]; .version == "1.3.2")' metadata.json
          test -s docs/packaging/releases/v1.3.2.md
          bash -n scripts/package-linux.sh
          python3 scripts/check-localization.py

  windows-x64:
    needs: validate
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out the v1.3.2 source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false

      - name: Install stable Rust
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc

      - name: Verify Windows log retention and locking
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo test --locked -p runtime-log --test runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run workspace regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo test --workspace --locked --no-fail-fast
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build release binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --locked --release --target x86_64-pc-windows-msvc -p shell -p cli

      - name: Package and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/tundra-shell.exe package/
          Copy-Item target/x86_64-pc-windows-msvc/release/tundra-cli.exe package/
          Copy-Item -Recurse crates/ascii-assets/assets package/assets
          foreach ($locale in @("en-US", "zh-CN")) {
            if (!(Test-Path "package/assets/locales/$locale/manifest.toml")) {
              throw "Missing packaged locale: $locale"
            }
          }
          Copy-Item LICENSE package/
          Copy-Item crates/weathr/LICENSE.weathr package/
          Compress-Archive -Path package/* -DestinationPath TundraUX3-v1.3.2-windows-x64.zip
          $hash = (Get-FileHash TundraUX3-v1.3.2-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  TundraUX3-v1.3.2-windows-x64.zip" |
            Out-File TundraUX3-v1.3.2-windows-x64.sha256 -Encoding ascii
          Get-Item package/* | Format-Table Name,Length

      - name: Stage Windows release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64
          path: |
            TundraUX3-v1.3.2-windows-x64.zip
            TundraUX3-v1.3.2-windows-x64.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  macos-universal:
    needs: validate
    name: macOS Universal
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out the v1.3.2 source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false

      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Run workspace regression tests
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$(cd "$RUNNER_TEMP" && pwd -P)"
          cargo test --workspace --locked --no-fail-fast
          bash scripts/check-weathr-dependency-boundary.sh

      - name: Build ARM64 and Intel release binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --target aarch64-apple-darwin -p shell -p cli
          cargo build --locked --release --target x86_64-apple-darwin -p shell -p cli

      - name: Create Universal binaries, package, and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          lipo -create \
            target/aarch64-apple-darwin/release/tundra-shell \
            target/x86_64-apple-darwin/release/tundra-shell \
            -output package/tundra-shell
          lipo -create \
            target/aarch64-apple-darwin/release/tundra-cli \
            target/x86_64-apple-darwin/release/tundra-cli \
            -output package/tundra-cli
          chmod 755 package/tundra-shell package/tundra-cli
          cp -R crates/ascii-assets/assets package/assets
          for locale in en-US zh-CN; do
            test -s "package/assets/locales/$locale/manifest.toml"
          done
          cp LICENSE package/
          cp crates/weathr/LICENSE.weathr package/
          lipo -info package/tundra-shell
          lipo -info package/tundra-cli
          tar -C package -czf TundraUX3-v1.3.2-macos-universal.tar.gz \
            tundra-shell tundra-cli assets LICENSE LICENSE.weathr
          shasum -a 256 TundraUX3-v1.3.2-macos-universal.tar.gz \
            > TundraUX3-v1.3.2-macos-universal.sha256

      - name: Stage macOS release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-universal
          path: |
            TundraUX3-v1.3.2-macos-universal.tar.gz
            TundraUX3-v1.3.2-macos-universal.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  linux-x64:
    needs: validate
    name: Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the v1.3.2 source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false

      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Run workspace regression tests
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$(cd "$RUNNER_TEMP" && pwd -P)"
          cargo test --workspace --locked --no-fail-fast
          bash scripts/check-weathr-dependency-boundary.sh

      - name: Build Linux portable archive
        shell: bash
        env:
          TUNDRAUX3_VERSION: 1.3.2
        run: |
          set -euo pipefail
          bash scripts/package-linux.sh --tar-only
          mv dist/tundraux3-1.3.2-linux-x86_64.tar.gz \
            dist/TundraUX3-v1.3.2-linux-x86_64.tar.gz
          cd dist
          sha256sum \
            TundraUX3-v1.3.2-linux-x86_64.tar.gz \
            > TundraUX3-v1.3.2-linux-x86_64.sha256

      - name: Stage Linux release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-x64
          path: |
            dist/TundraUX3-v1.3.2-linux-x86_64.tar.gz
            dist/TundraUX3-v1.3.2-linux-x86_64.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: [windows-x64, macos-universal, linux-x64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - name: Download verified build assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify staged checksums and exact asset set
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for asset in \
            windows-x64.zip windows-x64.sha256 \
            macos-universal.tar.gz macos-universal.sha256 \
            linux-x86_64.tar.gz linux-x86_64.sha256; do
            test -s "TundraUX3-v1.3.2-$asset"
          done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 6
          for checksum in *.sha256; do
            sha256sum -c "$checksum"
          done
      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          cp docs/packaging/releases/v1.3.2.md release-notes.md
          printf '\n构建提交：`%s`。\n' "$RELEASE_REF" >> release-notes.md
      - name: Upload and verify draft before publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --target "$RELEASE_REF" --draft \
              --repo "$GITHUB_REPOSITORY" --title V1.3.2 --notes-file release-notes.md
          fi
          # A published tag must never be moved or replaced on a rerun.
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')" = "$RELEASE_REF"
          gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | [.name, .digest] | @tsv' > remote-digests.tsv
          test "$(wc -l < remote-digests.tsv)" -eq 6
          for asset in dist/*; do
            name="$(basename "$asset")"
            digest="sha256:$(sha256sum "$asset" | cut -d' ' -f1)"
            grep -Fqx "$(printf '%s\t%s' "$name" "$digest")" remote-digests.tsv
          done
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_REF" --title V1.3.2 --notes-file release-notes.md --draft=false --latest
      - name: Verify published release and tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,publishedAt,url,assets > release.json
          jq -e '.tagName == "v1.3.2" and .name == "V1.3.2" and .isDraft == false and .isPrerelease == false and (.assets | length == 6)' release.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')" = "$RELEASE_REF"
          cat release.json
