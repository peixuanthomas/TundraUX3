name: Cross-platform compile

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msrv:
    name: Minimum Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Read minimum Rust version
        id: msrv
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path

          manifest = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))
          version = manifest["workspace"]["package"]["rust-version"]
          if version.count(".") == 1:
              version += ".0"
          print(f"toolchain={version}")
          PY
      - name: Install minimum Rust
        shell: bash
        env:
          MSRV_TOOLCHAIN: ${{ steps.msrv.outputs.toolchain }}
        run: rustup toolchain install "$MSRV_TOOLCHAIN" --profile minimal && rustup default "$MSRV_TOOLCHAIN"
      - name: Check all workspace targets and features
        shell: bash
        run: cargo check --workspace --all-targets --all-features --locked

  compile:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows workspace compile
            os: windows-latest
          - name: macOS workspace compile
            os: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install stable Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Compile workspace
        shell: bash
        run: cargo build --workspace --locked
      - name: Build bundled Vim for editor tests
        shell: bash
        run: python3 scripts/build-vim.py --output target/debug/vim
      - name: Test real Vim runtime
        shell: bash
        run: |
          vim_binary="$PWD/target/debug/vim/vim"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            vim_binary="${vim_binary}.exe"
          fi
          TUNDRA_TEST_VIM="$vim_binary" cargo test --locked -p vim-runtime -- --include-ignored
      - name: Test document and Explorer file safety
        shell: bash
        run: |
          cargo test --locked -p platform --lib document::
          cargo test --locked -p app --lib explorer::tasks::
          cargo test --locked -p app --test explorer_tasks
          cargo test --locked -p shell --test editor
          cargo test --locked -p app --test editor_advanced --test editor_scalability --test editor_line_changes
          cargo test --locked -p app --lib editor::background::
          cargo test --locked -p shell --lib editor
          cargo test --locked -p ui --test editor
      - name: Test localization and resource recovery
        shell: bash
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_check_localization.py'
          python3 scripts/check-localization.py
          cargo test --locked -p i18n -p ascii-assets
          cargo test --locked -p ui --test localization
          cargo test --locked -p shell session::localization::tests --lib
      - name: Test system metrics
        shell: bash
        run: |
          cargo test --locked -p platform --test linux_logs
          cargo test --locked -p runtime-log
          cargo test --locked -p app runtime_logs
          cargo test --locked -p cli --test logs
          cargo test --locked -p ui --test logs
          cargo test --locked -p platform --test system_status
          cargo test --locked -p system-services --no-default-features
          cargo test --locked -p system-services --features runtime
      - name: Check Weathr dependency boundary
        shell: bash
        run: bash scripts/check-weathr-dependency-boundary.sh
