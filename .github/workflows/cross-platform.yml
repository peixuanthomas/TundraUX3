name: Cross-platform compile

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows workspace compile
            os: windows-latest
          - name: macOS workspace compile
            os: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install stable Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Compile workspace
        shell: bash
        run: cargo build --workspace --locked
      - name: Check Weathr dependency boundary
        shell: bash
        run: bash scripts/check-weathr-dependency-boundary.sh
