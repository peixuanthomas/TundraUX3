name: Cross-platform regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows full regression
            os: windows-latest
            command: cargo test --workspace --locked
          - name: macOS workspace compile
            os: macos-latest
            command: cargo test --workspace --locked --no-run
    steps:
      - uses: actions/checkout@v6
      - name: Install stable Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Validate workspace
        shell: bash
        run: ${{ matrix.command }}
