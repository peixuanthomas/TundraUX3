[package]
name = "cli"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "tundra-cli"
path = "src/main.rs"

[dependencies]
session-protocol = { path = "../session-protocol" }
i18n = { path = "../i18n" }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
runtime-log = { path = "../runtime-log" }
app = { path = "../app" }
ascii-assets = { path = "../ascii-assets" }
platform = { path = "../platform" }
shell = { path = "../shell" }
storage = { path = "../storage" }
watchdog = { path = "../watchdog", features = ["tokio"] }
rustyline = "17.0"
shlex = "2.0"
toml = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
zbus = { version = "5.18", features = ["blocking-api"] }

[build-dependencies]
ascii-assets = { path = "../ascii-assets" }
