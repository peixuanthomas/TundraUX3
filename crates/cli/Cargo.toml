[package]
name = "cli"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "tundra-cli"
path = "src/main.rs"

[dependencies]
app = { path = "../app" }
ascii-assets = { path = "../ascii-assets" }
platform = { path = "../platform" }
shell = { path = "../shell" }
storage = { path = "../storage" }
watchdog = { path = "../watchdog", features = ["tokio"] }
weathr = { path = "../weathr" }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
zbus = { version = "5.18", features = ["blocking-api"] }

[build-dependencies]
ascii-assets = { path = "../ascii-assets" }
