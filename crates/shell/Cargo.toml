[package]
name = "shell"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "tundra-shell"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
crossterm.workspace = true
ratatui.workspace = true
tachyonfx.workspace = true
portable-pty = "0.9"
vt100 = "0.15.2"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
platform = { path = "../platform" }
app = { path = "../app" }
identity = { path = "../identity" }
storage = { path = "../storage" }
ui = { path = "../ui" }
watchdog = { path = "../watchdog", features = ["tokio"] }
weathr = { path = "../weathr" }
system-services = { path = "../system-services" }
time = { version = "0.1.1", path = "../time" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
watchdog = { path = "../watchdog", features = ["test-support", "tokio"] }

[build-dependencies]
ascii-assets = { path = "../ascii-assets" }
