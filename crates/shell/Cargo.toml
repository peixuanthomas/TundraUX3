[package]
name = "shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "tundra-shell"
path = "src/main.rs"

[dependencies]
shell-control = { path = "../shell-control" }
workspace-protocol = { path = "../workspace-protocol" }
auto-admin = { path = "../auto-admin" }
terminal-runtime = { path = "../terminal-runtime" }
vim-runtime = { path = "../vim-runtime" }
script-runtime = { path = "../script-runtime" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
getrandom = "0.4"
shell-words = "1.1"
zeroize = "1"
ascii-assets = { path = "../ascii-assets" }
i18n = { path = "../i18n" }
runtime-log = { path = "../runtime-log" }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
crossterm.workspace = true
ratatui.workspace = true
tachyonfx.workspace = true
vt100 = "0.15.2"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
platform = { path = "../platform" }
app = { path = "../app" }
identity = { path = "../identity" }
storage = { path = "../storage" }
ui = { path = "../ui" }
watchdog = { path = "../watchdog", features = ["tokio"] }
weathr = { path = "../weathr" }
system-services = { path = "../system-services", features = ["runtime"] }
time = { version = "1.3.4", path = "../time" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
auto-admin = { path = "../auto-admin", features = ["test-support"] }
watchdog = { path = "../watchdog", features = ["test-support", "tokio"] }

[build-dependencies]
ascii-assets = { path = "../ascii-assets" }
