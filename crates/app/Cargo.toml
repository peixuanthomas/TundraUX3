[package]
name = "app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[lib]
path = "src/lib.rs"

[dependencies]
i18n = { path = "../i18n" }
runtime-log = { path = "../runtime-log" }
chrono = "0.4"
chrono-tz = "0.10"
comrak = { version = "0.54", default-features = false }
regex = "1"
lsh = { path = "../../third_party/lsh", default-features = false, features = ["glob"] }
ropey = { version = "1.6", default-features = false, features = ["cr_lines", "simd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ascii-assets = { path = "../ascii-assets" }
identity = { path = "../identity" }
platform = { path = "../platform" }
storage = { path = "../storage" }
watchdog = { path = "../watchdog" }
unicode-segmentation = "1.12"
unicode-width = "0.2"
time = { version = "1.3.4", path = "../time" }
system-services = { path = "../system-services", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "hickory-dns"] }
tokio = { version = "1", features = ["rt", "time", "net", "macros"] }
semver = "1"
toml = "0.8"
zip = { version = "6", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
flate2 = "1"
tar = "0.4"

[dev-dependencies]
watchdog = { path = "../watchdog", features = ["test-support"] }

[build-dependencies]
lsh = { path = "../../third_party/lsh", default-features = false, features = ["compiler"] }
