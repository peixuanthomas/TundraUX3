[package]
name = "app"
version.workspace = true
edition.workspace = true
build = "build.rs"

[lib]
path = "src/lib.rs"

[dependencies]
runtime-log = { path = "../runtime-log" }
chrono = "0.4"
comrak = { version = "0.54", default-features = false }
ropey = { version = "1.6", default-features = false, features = ["cr_lines", "simd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ascii-assets = { path = "../ascii-assets" }
identity = { path = "../identity" }
platform = { path = "../platform" }
storage = { path = "../storage" }
watchdog = { path = "../watchdog" }
unicode-segmentation = "1.12"
unicode-width = "0.2"
time = { version = "1.3.0", path = "../time" }
system-services = { path = "../system-services", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
semver = "1"
toml = "0.8"
zip = { version = "6", default-features = false, features = ["deflate"] }
