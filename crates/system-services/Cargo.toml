[package]
name = "system-services"
version.workspace = true
edition.workspace = true

[features]
default = []
runtime = [
    "dep:async-trait", "dep:chrono-tz", "dep:dirs", "dep:platform",
    "dep:reqwest", "dep:serde_json", "dep:thiserror", "dep:time",
    "dep:tokio", "dep:watchdog", "dep:runtime-log",
]

[dependencies]
runtime-log = { path = "../runtime-log", optional = true }
async-trait = { version = "0.1", optional = true }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", optional = true }
dirs = { version = "6.0", optional = true }
reqwest = { optional = true, version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
thiserror = { version = "2.0", optional = true }
tokio = { optional = true, version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs"] }
time = { optional = true, path = "../time" }
watchdog = { optional = true, path = "../watchdog", features = ["tokio"] }
platform = { optional = true, path = "../platform" }

[dev-dependencies]
tempfile = "3.0"
watchdog = { path = "../watchdog", features = ["test-support", "tokio"] }
