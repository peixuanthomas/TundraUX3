[package]
name = "system-services"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dirs = "6.0"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs"] }
time = { path = "../time" }
watchdog = { path = "../watchdog", features = ["tokio"] }
system-services-model = { path = "../system-services-model" }
platform = { path = "../platform" }

[dev-dependencies]
tempfile = "3.0"
watchdog = { path = "../watchdog", features = ["test-support", "tokio"] }
