[package]
name = "launcher"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "tundra"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
platform = { path = "../platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
sha2 = "0.10"
storage = { path = "../storage" }
watchdog = { path = "../watchdog" }

[build-dependencies]
sha2 = "0.10"
