[package]
name = "platform"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
ratatui-image.workspace = true
same-file = "1"
watchdog = { path = "../watchdog" }

[target.'cfg(target_os = "linux")'.dependencies]
# Keep desktop-only integrations out of the Windows and macOS dependency graph.
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
freedesktop-desktop-entry = "0.8.1"
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = { version = "0.47", default-features = false, features = ["text"] }
zbus = { version = "5.18", features = ["blocking-api"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }
