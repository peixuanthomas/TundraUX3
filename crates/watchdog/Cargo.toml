[package]
name = "watchdog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
test-support = []
tokio = ["dep:futures-util", "dep:tokio"]

[dependencies]
runtime-log = { path = "../runtime-log" }
workspace-protocol = { path = "../workspace-protocol" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", optional = true }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }
