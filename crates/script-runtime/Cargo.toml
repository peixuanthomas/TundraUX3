[package]
name = "script-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
app = { path = "../app" }
i18n = { path = "../i18n" }
terminal-runtime = { path = "../terminal-runtime" }
watchdog = { path = "../watchdog" }
base64 = "0.22"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
watchdog = { path = "../watchdog", features = ["test-support"] }
