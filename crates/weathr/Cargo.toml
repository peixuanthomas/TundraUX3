[package]
name = "weathr"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
authors = ["Dony Mulya <veirt@duck.com>"]
description = "TundraUX-integrated terminal ASCII weather scene renderer"

[lib]
path = "src/lib.rs"

[dependencies]
ratatui-core = "=0.1.2"
ratatui-crossterm = { version = "=0.1.2", default-features = false, features = ["crossterm_0_29"] }
unicode-width = "0.2"
chrono = { version = "0.4", features = ["serde"] }
crossterm.workspace = true
rand = "0.10"
thiserror = "2.0"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
    "signal",
] }
system-services = { path = "../system-services", default-features = false }
