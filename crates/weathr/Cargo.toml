[package]
name = "weathr"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
authors = ["Dony Mulya <veirt@duck.com>"]
description = "TundraUX-integrated terminal ASCII weather scene renderer"

[lib]
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
crossterm.workspace = true
rand = "0.10"
thiserror = "2.0"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
    "signal",
] }
ascii-assets = { path = "../ascii-assets" }
system-services-model = { path = "../system-services-model" }
watchdog = { path = "../watchdog", features = ["tokio"] }

[dev-dependencies]
watchdog = { path = "../watchdog", features = ["test-support"] }
