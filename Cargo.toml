[workspace]
members = [
    "crates/app",
    "crates/ascii-assets",
    "crates/cli",
    "crates/identity",
    "crates/platform",
    "crates/shell",
    "crates/storage", "crates/time",
    "crates/system-services",
    "crates/system-services-model",
    "crates/ui",
    "crates/watchdog",
    "crates/weathr",
]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"

[workspace.dependencies]
ratatui = { version = "=0.30.2", default-features = false, features = [
    "all-widgets",
    "crossterm_0_29",
    "layout-cache",
    "macros",
    "underline-color",
] }
ratatui-image = { version = "=11.0.6", default-features = false, features = ["crossterm"] }
crossterm = "=0.29.0"

[profile.release]
panic = "unwind"

[patch.crates-io]
vt100 = { path = "third_party/vt100" }
