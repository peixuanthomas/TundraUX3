[workspace]
members = [
    "crates/shell-control",
    "crates/i18n",
    "crates/runtime-log",
    "crates/app",
    "crates/auto-admin",
    "crates/ascii-assets",
    "crates/cli",
    "crates/identity",
    "crates/platform",
    "crates/shell",
    "crates/storage",
    "crates/time",
    "crates/terminal-runtime",
    "crates/script-runtime",
    "crates/vim-runtime",
    "crates/system-services",
    "crates/ui",
    "crates/watchdog",
    "crates/weathr",
]
resolver = "3"
exclude = ["third_party/crossterm", "third_party/lsh"]

[workspace.package]
version = "1.4.1"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"

[workspace.dependencies]
animate = { version = "=0.8.0", features = ["macros", "ratatui"] }
ratatui = { version = "=0.30.2", default-features = false, features = [
    "all-widgets",
    "crossterm_0_29",
    "layout-cache",
    "macros",
    "underline-color",
] }
ratatui-image = { version = "=11.0.6", default-features = false, features = ["crossterm"] }
crossterm = "=0.29.0"
tachyonfx = { version = "=0.25.1", default-features = false, features = ["std-duration"] }

[profile.release]
panic = "unwind"

[patch.crates-io]
crossterm = { path = "third_party/crossterm" }
vt100 = { path = "third_party/vt100" }
