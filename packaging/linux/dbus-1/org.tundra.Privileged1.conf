<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.tundra.Privileged1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.tundra.Privileged1" send_interface="org.tundra.Privileged1"/>
    <allow send_destination="org.tundra.Privileged1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.tundra.Privileged1" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
