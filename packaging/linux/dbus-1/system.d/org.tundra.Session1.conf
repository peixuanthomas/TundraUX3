<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.tundra.Session1"/>
    <allow send_destination="org.tundra.Session1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.tundra.Session1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.tundra.Session1" send_interface="org.tundra.Session1" send_member="GetSnapshot"/>
    <allow send_destination="org.tundra.Session1" send_interface="org.tundra.Session1" send_member="Lock"/>
    <allow send_destination="org.tundra.Session1" send_interface="org.tundra.Session1" send_member="Logout"/>
    <allow send_destination="org.tundra.Session1" send_interface="org.tundra.Session1" send_member="SwitchUser"/>
  </policy>
</busconfig>
